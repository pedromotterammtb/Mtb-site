<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SportLearn</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b0d10;color:#fff}.app{min-height:100vh;padding:22px;max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:28px;font-weight:800}.dots{font-size:30px;background:#171a20;border:0;color:#fff;border-radius:12px;padding:4px 14px;cursor:pointer}.menu{display:none;position:absolute;right:22px;top:75px;background:#181c22;border:1px solid #303640;border-radius:16px;padding:10px;width:230px;z-index:5}.menu.open{display:block}.menu button,.card{width:100%;background:#20252d;color:#fff;border:0;border-radius:14px;padding:15px;margin:5px 0;text-align:left;cursor:pointer}.hero{padding:55px 0 30px}.hero h1{font-size:42px;margin:0 0 10px}.hero p{color:#aeb6c2;font-size:17px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{font-size:18px;font-weight:700;border:1px solid #2d333d}.card small{display:block;color:#9da6b3;font-weight:400;margin-top:7px}.page{display:none}.page.active{display:block}.back{background:none;border:0;color:#aeb6c2;font-size:16px;cursor:pointer;margin:15px 0}.pill{display:inline-block;background:#20252d;border-radius:99px;padding:7px 11px;color:#bfc7d2}.learn{padding:20px;background:#15191f;border-radius:18px;margin:10px 0}.learn h3{margin:0 0 6px}.learn p{margin:0;color:#aeb6c2;line-height:1.45}</style></head><body><main class="app">
<div class="top"><div class="logo">SportLearn</div><button class="dots" onclick="toggleMenu()">⋮</button></div><div id="menu" class="menu"><button onclick="show('sports')">🏃 Escolher esporte</button><button onclick="show('home')">🏠 Início</button></div>
<section id="home" class="page active"><div class="hero"><h1>Aprenda seu esporte.</h1><p>Escolha um esporte, depois a modalidade e descubra o que você pode aprender.</p></div><button class="card" onclick="show('sports')">🎯 Escolher esporte<small>Comece sua jornada de aprendizado</small></button></section>
<section id="sports" class="page"><button class="back" onclick="show('home')">← Voltar</button><h1>Escolha o esporte</h1><div class="grid"><button class="card" onclick="show('bike')">🚵 Bike<small>MTB, estrada e BMX</small></button><button class="card" onclick="show('football')">⚽ Futebol<small>Chutes, dribles e fundamentos</small></button><button class="card" onclick="show('basketball')">🏀 Basquete<small>Arremessos, dribles e técnicas</small></button><button class="card" onclick="show('running')">🏃 Atletismo<small>Corrida, respiração e técnica</small></button></div></section>
<section id="football" class="page"><button class="back" onclick="show('sports')">← Esportes</button><h1>⚽ Futebol</h1><p class="pill">O que você quer aprender?</p><div class="grid"><button class="card" onclick="openFootball('Chutar melhor')">🥅 Chutar melhor<small>Precisão, força e técnica</small></button><button class="card" onclick="openFootball('Novos dribles')">🕺 Novos dribles<small>Escolha um drible para aprender</small></button><button class="card" onclick="openFootball('Passe melhor')">🎯 Passe melhor<small>Precisão e controle</small></button><button class="card" onclick="openFootball('Domínio de bola')">⚽ Domínio de bola<small>Primeiro toque e controle</small></button></div></section>
<section id="basketball" class="page"><button class="back" onclick="show('sports')">← Esportes</button><h1>🏀 Basquete</h1><p class="pill">O que você quer aprender?</p><div class="grid"><button class="card" onclick="openBasketball('Arremessar melhor')">🏀 Arremessar melhor<small>Precisão, postura e controle</small></button><button class="card" onclick="openBasketball('Fazer dribles')">🏀 Fazer dribles<small>Controle e mudanças de direção</small></button><button class="card" onclick="openBasketball('Melhorar o controle')">🎯 Melhorar o controle<small>Domínio da bola e coordenação</small></button><button class="card" onclick="openBasketball('Melhorar a defesa')">🛡️ Melhorar a defesa<small>Posição, deslocamento e reação</small></button><button class="card" onclick="openBasketball('Melhorar a velocidade')">⚡ Melhorar a velocidade<small>Movimentação e tomada de decisão</small></button></div></section>
<section id="running" class="page"><button class="back" onclick="show('sports')">← Esportes</button><h1>🏃 Atletismo</h1><p class="pill">O que você quer aprender?</p><div class="grid"><button class="card" onclick="openRunning('Correr melhor')">🏃 Correr melhor<small>Técnica, ritmo e postura</small></button><button class="card" onclick="openRunning('Respiração na corrida')">🌬️ Respiração na corrida<small>Ritmo e controle da respiração</small></button><button class="card" onclick="openRunning('Melhorar resistência')">⏱️ Melhorar resistência<small>Evolução gradual</small></button><button class="card" onclick="openRunning('Largada e velocidade')">💨 Largada e velocidade<small>Coordenação e aceleração</small></button></div></section>
<section id="bike" class="page"><button class="back" onclick="show('sports')">← Esportes</button><h1>🚵 Modalidades de Bike</h1><p class="pill">Escolha uma modalidade</p><div class="grid" id="bikeGrid"></div></section>
<section id="learn" class="page"><button class="back" onclick="show('bike')">← Modalidades</button><div id="learnContent"></div></section>
</main><script>
const modes={
Enduro:['Curvas em trilha','Frenagem e controle','Descidas técnicas','Saltos e obstáculos','Leitura de terreno','Posição do corpo'],
Gravel:['Controle em estradão','Curvas em cascalho','Frenagem','Subidas longas','Descidas','Navegação e ritmo'],
Speed:['Posição aerodinâmica','Troca de marchas','Curvas','Frenagem','Cadência','Treino de resistência'],
Downhill:['Posição de ataque','Frenagem em descida','Curvas inclinadas','Saltos','Rock gardens','Leitura da linha'],
Street:['Equilíbrio','Bunny hop','Manual','Curvas','Saltos pequenos','Controle urbano'],
BMX:['Bunny hop','Manual','Pump track','Curvas inclinadas','Saltos','Controle da bike'],
XC:['Cadência e ritmo','Subidas','Descidas','Curvas em trilha','Leitura do terreno','Eficiência na pedalada']};
const icons={Enduro:'🏔️',Gravel:'🪨',Speed:'⚡',Downhill:'⛰️',Street:'🛣️',BMX:'🛹',XC:'🌲'};
const grid=document.getElementById('bikeGrid');Object.entries(modes).forEach(([m])=>{let b=document.createElement('button');b.className='card';b.innerHTML=`${icons[m]} ${m}<small>Ver o que aprender</small>`;b.onclick=()=>openMode(m);grid.appendChild(b)});
function toggleMenu(){document.getElementById('menu').classList.toggle('open')}function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.getElementById('menu').classList.remove('open');window.scrollTo(0,0)}
function openMode(m){document.getElementById('learnContent').innerHTML=`<h1>${icons[m]} ${m}</h1><p class="pill">O que você quer aprender?</p>`+modes[m].map((x,i)=>`<button class="card learn" onclick="openLesson('${m}','${x}')"><h3>${i+1}. ${x}</h3><p>Toque para ver o passo a passo.</p></button>`).join('');show('learn')}
function openFootball(topic){
if(topic==='Novos dribles'){
 document.getElementById('learnContent').innerHTML=`<button class=\"back\" onclick=\"show('football')\">← Futebol</button><h1>🕺 Novos dribles</h1><p class=\"pill\">Escolha um drible</p><div class=\"grid\"><button class=\"card\" onclick=\"footballLesson('Pedalada')\">🔄 Pedalada<small>Aprenda o movimento passo a passo</small></button><button class=\"card\" onclick=\"footballLesson('Corte para o lado')\">↔️ Corte para o lado<small>Mude de direção com controle</small></button><button class=\"card\" onclick=\"footballLesson('Finta de corpo')\">🕺 Finta de corpo<small>Engane o marcador com o corpo</small></button><button class=\"card\" onclick=\"footballLesson('Puxada e saída')\">⚡ Puxada e saída<small>Controle a bola e acelere</small></button><button class=\"card\" onclick=\"footballLesson('Elástico')\">⚡ Elástico<small>Toque rápido para mudar de direção</small></button><button class=\"card\" onclick=\"footballLesson('La Croqueta')\">↔️ La Croqueta<small>Dois toques rápidos para escapar</small></button><button class=\"card\" onclick=\"footballLesson('Chapéu')\">🎩 Chapéu<small>Eleve a bola com controle</small></button><button class=\"card\" onclick=\"footballLesson('Rabona')\">🌀 Rabona<small>Técnica avançada de passe ou cruzamento</small></button></div>`; show('learn'); return;
}
const data={
'Chutar melhor':['Treine com uma bola parada e um alvo seguro.','Apoie o pé ao lado da bola, apontando para o alvo.','Use o peito do pé para chutes fortes ou a parte interna para maior precisão.','Mantenha o olhar na bola no momento do contato e finalize o movimento na direção do alvo.','Comece perto do alvo e aumente a distância gradualmente, sem precisar chutar com força máxima.'],
'Passe melhor':['Comece com passes curtos usando a parte interna do pé.','Coloque o pé de apoio ao lado da bola e aponte para o companheiro ou alvo.','Faça um contato firme e controlado no centro da bola.','Receba a bola, domine e passe novamente usando os dois pés.','Aumente a distância e a velocidade aos poucos.'],
'Domínio de bola':['Comece recebendo passes lentos.','Relaxe o pé no contato para amortecer a bola.','Mantenha a bola perto do corpo depois do primeiro toque.','Treine com os dois pés e diferentes alturas de passe.','Aumente gradualmente a velocidade do exercício.']};
showFootballSteps(topic,data[topic]);
}
function showFootballSteps(topic,steps){document.getElementById('learnContent').innerHTML=`<button class=\"back\" onclick=\"show('football')\">← Futebol</button><h1>⚽ ${topic}</h1><p class=\"pill\">Passo a passo</p>`+steps.map((s,i)=>`<div class=\"learn\"><h3>Passo ${i+1}</h3><p>${s}</p></div>`).join('');show('learn')}
function footballLesson(dribble){const lessons={
'Pedalada':['Fique parado com a bola à frente e pratique passar o pé ao redor dela.','Depois faça o movimento caminhando lentamente.','Inclua uma pequena mudança de direção depois da pedalada.','Treine para os dois lados, primeiro sem velocidade.','Use o drible em situações simples de treino e pare se perder o controle.'],
'Corte para o lado':['Conduza a bola devagar com a parte interna do pé.','Coloque o corpo sobre a bola e faça um toque lateral curto.','Mude a direção imediatamente depois do toque.','Treine para os dois lados em baixa velocidade.','Aumente a velocidade somente quando conseguir manter a bola perto.'],
'Finta de corpo':['Conduza a bola lentamente.','Incline o ombro e o corpo para um lado sem perder o equilíbrio.','Mude o peso do corpo rapidamente para o outro lado.','Dê um toque curto na direção oposta à finta.','Pratique primeiro sem marcador e depois com um colega em exercício controlado.'],
'Puxada e saída':['Pare a bola e pratique puxá-la para trás com a sola do pé.','Depois faça a puxada enquanto caminha.','Após puxar, dê um toque para o lado e saia em outra direção.','Treine para os dois lados.','Aumente a velocidade gradualmente, mantendo a bola próxima.'],
'Elástico':['Pratique primeiro o movimento parado, levando a bola rapidamente para um lado e de volta para o outro com o mesmo pé.','Faça o movimento caminhando lentamente, mantendo a bola perto.','Inclua uma mudança de direção logo depois do segundo toque.','Treine dos dois lados e aumente a velocidade aos poucos.','Use primeiro em treino controlado, priorizando equilíbrio e domínio da bola.'],
'La Croqueta':['Conduza a bola devagar e mantenha os joelhos levemente flexionados.','Use a parte interna de um pé para tocar a bola para o outro lado.','Receba a bola com a parte interna do outro pé e continue na nova direção.','Treine alternando os lados sem marcador.','Depois pratique em baixa velocidade com um colega, sempre com espaço suficiente.'],
'Chapéu':['Comece parado e pratique levantar a bola suavemente usando o pé.','Aprenda a controlar a altura e a direção da bola antes de tentar avançar.','Faça o movimento caminhando lentamente.','Treine primeiro sem marcador e em espaço aberto.','Aumente a dificuldade gradualmente, sem tentar movimentos altos ou arriscados.'],
'Rabona':['Comece sem movimento, praticando apenas o posicionamento dos pés.','Faça o movimento lentamente, usando uma bola parada e um alvo amplo.','Concentre-se no equilíbrio e no contato controlado com a bola.','Depois pratique caminhando em baixa velocidade.','Use a técnica em exercícios simples antes de tentar com mais velocidade.']};showFootballSteps(dribble,lessons[dribble])}
function openBasketball(topic){const data={
'Arremessar melhor':['Comece perto da cesta, em uma posição equilibrada e confortável.','Mantenha os pés estáveis e o corpo alinhado com o alvo.','Use a mão de arremesso para conduzir a bola e a outra apenas para ajudar no controle.','Finalize o movimento com o braço estendido e o punho relaxado, sem forçar.','Treine primeiro a precisão e depois aumente a distância gradualmente.'],
'Fazer dribles':['Comece quicando a bola na altura da cintura com uma mão.','Pratique alternar entre as mãos mantendo a bola próxima ao corpo.','Treine drible baixo para maior controle e mudança de direção.','Pratique mudanças simples de direção, como cruzar a bola de uma mão para a outra.','Aumente a velocidade somente quando conseguir controlar a bola com segurança.'],
'Melhorar o controle':['Faça dribles parados com cada mão.','Treine trocar a bola de uma mão para a outra sem olhar o tempo todo para ela.','Caminhe enquanto dribla e mantenha a bola próxima.','Pratique parar, mudar de direção e continuar o drible.','Use os dois lados do corpo para desenvolver coordenação.'],
'Melhorar a defesa':['Mantenha os joelhos levemente flexionados e o corpo equilibrado.','Fique de frente para o adversário e acompanhe seus movimentos sem cruzar os pés.','Treine deslocamentos laterais curtos e controlados.','Pratique reação a mudanças de direção em exercícios leves.','Priorize posicionamento e controle, sem empurrar ou fazer contato desnecessário.'],
'Melhorar a velocidade':['Treine arrancadas curtas em espaço adequado.','Mantenha o corpo equilibrado durante a aceleração.','Combine deslocamentos com dribles simples.','Pratique parar e acelerar novamente com controle.','Aumente a intensidade aos poucos e faça pausas para recuperação.']};showSteps('🏀',topic,data[topic],'basketball')}
function openRunning(topic){const data={
'Correr melhor':['Comece com alguns minutos de caminhada e trote leve para aquecer.','Mantenha a postura confortável, com o olhar à frente e os braços acompanhando o movimento.','Faça passadas naturais, evitando tentar correr rápido demais no início.','Mantenha um ritmo em que consiga controlar a respiração e falar frases curtas.','Aumente distância ou velocidade gradualmente, com dias de descanso quando necessário.'],
'Respiração na corrida':['Comece caminhando e respire de forma confortável, sem prender o ar.','Ao trotar, tente manter uma respiração regular e relaxada.','Sincronize naturalmente a respiração com os passos, sem precisar seguir uma contagem rígida.','Se estiver ficando ofegante demais, reduza o ritmo até recuperar o controle.','Pratique em ritmos fáceis antes de tentar corridas mais rápidas.'],
'Melhorar resistência':['Comece com períodos curtos de corrida alternados com caminhada.','Mantenha um ritmo confortável em que consiga controlar a respiração.','Aumente o tempo de corrida aos poucos, em vez de tentar aumentar tudo de uma vez.','Mantenha uma rotina consistente e inclua recuperação.','Quando estiver confortável, varie alguns trechos um pouco mais rápidos.'],
'Largada e velocidade':['Pratique primeiro uma largada tranquila, com equilíbrio.','Incline levemente o corpo para a frente ao iniciar a aceleração.','Use os braços de forma coordenada com as pernas.','Faça acelerações curtas e volte a caminhar para recuperar.','Aumente a velocidade gradualmente e pare se sentir dor ou tontura.']};showSteps('🏃',topic,data[topic],'running')}
function showSteps(icon,topic,steps,back){document.getElementById('learnContent').innerHTML=`<button class="back" onclick="show('${back}')">← Voltar</button><h1>${icon} ${topic}</h1><p class="pill">Passo a passo</p>`+steps.map((s,i)=>`<div class="learn"><h3>Passo ${i+1}</h3><p>${s}</p></div>`).join('');show('learn')}
function openLesson(m,x){const steps=[`Comece em um local adequado e fácil para o seu nível.`,`Aprenda a posição básica do corpo e faça o movimento lentamente.`,`Repita várias vezes, priorizando controle e técnica em vez de velocidade.`,`Aumente a dificuldade aos poucos somente quando estiver confortável.`,`Use capacete e equipamentos adequados e pratique com supervisão de um adulto quando necessário.`];document.getElementById('learnContent').innerHTML=`<button class="back" onclick="openMode('${m}')">← Voltar</button><h1>${icons[m]} ${x}</h1><p class="pill">Passo a passo</p>`+steps.map((s,i)=>`<div class="learn"><h3>Passo ${i+1}</h3><p>${s}</p></div>`).join('');show('learn')}
</script></body></html>
